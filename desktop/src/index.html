<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pear</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; margin: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        display: grid; place-items: center; min-height: 100vh;
        background: light-dark(#fafaf8, #171717);
        color: light-dark(#171717, #fafafa);
      }
      main { width: min(440px, 90vw); display: flex; flex-direction: column; gap: 16px; }
      h1 { font-size: 28px; letter-spacing: -0.02em; }
      p.sub { color: light-dark(#666, #999); font-size: 14px; }
      label { font-size: 12px; font-weight: 600; color: light-dark(#555, #aaa); }
      input[type="url"] {
        width: 100%; padding: 10px 12px; font-size: 14px; border-radius: 8px;
        border: 1px solid light-dark(#d4d4d4, #404040);
        background: light-dark(#fff, #262626); color: inherit;
      }
      button {
        padding: 10px 14px; font-size: 14px; font-weight: 600; border-radius: 8px;
        border: none; background: #16a34a; color: white; cursor: pointer;
      }
      button:hover { background: #15803d; }
      button.secondary {
        background: transparent; color: #16a34a;
        border: 1px solid light-dark(#d4d4d4, #404040);
      }
      button.secondary:hover { background: light-dark(#f0fdf4, #14532d22); }
      button:disabled { opacity: 0.6; cursor: default; }
      .local {
        display: flex; flex-direction: column; gap: 8px;
        border-top: 1px solid light-dark(#e5e5e5, #333); padding-top: 12px;
      }
      .recent { display: flex; flex-direction: column; gap: 6px; }
      .recent a { font-size: 13px; color: #16a34a; cursor: pointer; text-decoration: none; }
      .recent a:hover { text-decoration: underline; }
      .engines { font-size: 12px; color: light-dark(#666, #999); border-top: 1px solid light-dark(#e5e5e5, #333); padding-top: 12px; }
      .mode { font-size: 12px; color: light-dark(#888, #777); }
    </style>
  </head>
  <body>
    <main>
      <div>
        <h1>🍐 Pear</h1>
        <p class="sub">Connect to a workspace to get started.</p>
      </div>
      <form id="connect-form">
        <label for="url">Workspace URL</label>
        <input id="url" type="url" placeholder="http://localhost:3001" required />
        <div style="height:10px"></div>
        <button type="submit">Connect</button>
      </form>
      <div class="recent" id="recent"></div>
      <div class="local">
        <label>Local workspace (app-managed server)</label>
        <p class="mode">
          Runs SpacetimeDB + pear on this machine — no server needed. Data lives in the
          app's data folder. Attachments (file uploads) are not available in local mode yet.
        </p>
        <button type="button" id="local-start" class="secondary">Start local workspace</button>
        <span class="mode" id="local-status"></span>
      </div>
      <div class="engines" id="engines">Detecting agent engines…</div>
    </main>
    <script type="module" src="launcher.js"></script>
  </body>
</html>
