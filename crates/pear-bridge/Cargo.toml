[package]
name = "pear-bridge"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local-shell execution daemon for the Pear `tool-bash` capability. See docs/PEAR_BRIDGE.md."

# This is the start of the standalone OSS `pear-bridge` repo described in
# docs/PEAR_BRIDGE.md § Repo structure. It currently holds only the
# AllowlistEnforcer (implementation order step 3) and its exhaustive tests.
# The relay client (tokio-tungstenite), PTY (portable-pty), keychain (keyring),
# audit chain, and service registration land in later modules and bring their
# own dependencies at that point.

[lib]
path = "src/lib.rs"

[[bin]]
name = "pear-bridge"
path = "src/main.rs"

[dependencies]
regex = "1"
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
toml = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
futures-util = "0.3"
# Minimal HTTP client for the `POST /api/bridge/auth` tunnel-token exchange.
# native-tls reuses the TLS stack tokio-tungstenite already pulls in (no second
# rustls tree); json for the AuthResponse body.
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }
# default-features = false is REQUIRED: keyring's defaults enable the
# `sync-secret-service` backend (→ dbus-secret-service → libdbus-sys, a C system
# lib). Feature unification would keep that even with a per-target override, so
# the base dep must opt out and each target opts back in to exactly one backend.
keyring = { version = "3", default-features = false }

# Platform-native credential stores for the device token (PEAR_BRIDGE.md
# Layer 2 — keychain only, never on disk).
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

# Linux: the pure-Rust (zbus) Secret Service backend with RustCrypto. Persistent
# desktop keychain (GNOME Keyring / KWallet) and — unlike `sync-secret-service`
# (dbus-secret-service → libdbus-sys) — needs no `libdbus-1-dev` C system lib, so
# it builds on minimal/CI hosts. `linux-native` (kernel keyutils) is rejected:
# it is not persistent across reboots, which a long-lived device token requires.
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["async-secret-service", "crypto-rust", "tokio"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", default-features = false, features = ["windows-native"] }

[dev-dependencies]
# Used by tests/audit_tests.rs to parse log lines directly.
serde_json = "1"
# `test-util` enables tokio's pausable virtual clock (`start_paused`) so the
# keepalive idle-timeout test in transport.rs runs instantly instead of waiting
# out real seconds. Dev-only — not shipped in the daemon binary.
tokio = { version = "1", features = ["test-util"] }
