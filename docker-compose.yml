services:
  # ── MinIO (S3-compatible blob storage) ───────────────────────────────────────
  # Used for file uploads (images, audio, attachments). Same API as AWS S3 / R2.
  # Override S3_* env on the web service to use external storage (e.g. R2) instead.
  minio:
    image: minio/minio:latest
    container_name: pear-minio
    command: server /data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web console (optional)
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio-data:/data
    restart: unless-stopped
    networks:
      - pear

  # Create the default bucket so the app can upload without extra setup.
  minio-init:
    image: minio/mc:latest
    container_name: pear-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO...';
      sleep 5;
      mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb myminio/$${S3_BUCKET:-pear-attachments} --ignore-existing;
      echo 'Bucket ready';
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_BUCKET: ${S3_BUCKET:-pear-attachments}
    networks:
      - pear

  # ── SpacetimeDB ────────────────────────────────────────────────────────────
  # Pre-build the module before starting: cd server && spacetime build
  spacetimedb:
    image: clockworklabs/spacetime:v2.0.3
    container_name: pear-spacetimedb
    ports:
      - "3000:3000"
    volumes:
      - spacetimedb-data:/stdb/data
      # Persist the spacetime CLI identity across container restarts.
      # Without this, every restart generates a new identity that isn't the
      # database owner, causing a 403 on publish.
      - spacetimedb-config:/root/.config/spacetime
      # Entrypoint script (starts SpacetimeDB then publishes the module)
      - ./server/docker/entrypoint.sh:/entrypoint.sh:ro
      # Pre-built module WASM — run `cd server && spacetime build` first
      - ./server/spacetimedb/target/wasm32-unknown-unknown/release/server.wasm:/module/server.wasm:ro
    entrypoint: ["/bin/sh", "/entrypoint.sh"]
    environment:
      STDB_DB_NAME: ${SPACETIMEDB_DB_NAME:-pear-dev}
    user: root
    restart: unless-stopped
    networks:
      - pear

  # ── Next.js web client ──────────────────────────────────────────────────────
  web:
    # Image pulled from the Forgejo container registry on the remote.
    # Set WEB_IMAGE in your .env to the full registry path, e.g.:
    #   WEB_IMAGE=forgejo.yourdomain.com/kara/pear-web:latest
    # Falls back to a local tag for dev builds.
    image: ${WEB_IMAGE:-pear-web:latest}
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        # NEXT_PUBLIC_* vars are baked into the browser bundle at build time.
        # The browser must reach these URLs directly, so use the public-facing
        # addresses (Cloudflare Tunnel hostname or exposed host port).
        NEXT_PUBLIC_SPACETIMEDB_URI: ${SPACETIMEDB_PUBLIC_URI-ws://localhost:3000}
        NEXT_PUBLIC_SPACETIMEDB_DB_NAME: ${SPACETIMEDB_DB_NAME:-pear-dev}
        NEXT_PUBLIC_SPACETIMEAUTH_CLIENT_ID: ${SPACETIMEAUTH_CLIENT_ID:-}
        NEXT_PUBLIC_SPACETIMEAUTH_AUTHORITY: ${SPACETIMEAUTH_AUTHORITY:-}
        # Optional same-origin proxy to SpacetimeDB via Next.js rewrites.
        # Set SPACETIMEDB_PROXY_ORIGIN=http://spacetimedb:3000 and leave
        # SPACETIMEDB_PUBLIC_URI empty to let the browser use ws(s)://<web-host>.
        # The web app proxies /v1/* to the internal SpacetimeDB service.
        SPACETIMEDB_PROXY_ORIGIN: ${SPACETIMEDB_PROXY_ORIGIN:-}
    container_name: pear-web
    ports:
      - "3001:3001"
    depends_on:
      - spacetimedb
      - minio-init
    environment:
      # S3-compatible blob storage (default: MinIO in this stack)
      # Override to use external storage (e.g. R2, S3): set S3_ENDPOINT, S3_ACCESS_KEY, S3_SECRET_KEY.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      # Optional. Browser upload URL (presigned URLs). If unset, derived from request host + :9000 (zero config when app and MinIO are on the same host). Set only when MinIO is on another host/port.
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-pear-attachments}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_REGION: ${S3_REGION:-us-east-1}
    restart: unless-stopped
    networks:
      - pear

  # ── Pear LLM Worker ────────────────────────────────────────────────────────
  # Orcha agent: connects to SpacetimeDB, claims "orchestrate" and "llm" tasks,
  # calls Anthropic Claude, and submits results back to the coordination layer.
  # Set ANTHROPIC_API_KEY in your .env to enable.
  # Scale with: docker compose up --scale worker=3
  worker:
    image: ${WORKER_IMAGE:-pear-worker:latest}
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: pear-worker
    depends_on:
      - spacetimedb
    environment:
      SPACETIMEDB_URI: ws://spacetimedb:3000
      SPACETIMEDB_DB_NAME: ${SPACETIMEDB_DB_NAME:-pear-dev}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5-20251001}
      ORCHA_AGENT_ID: ${ORCHA_AGENT_ID:-pear-llm-worker}
      # Same storage as the web service — the worker fetches image attachments
      # to hand to AI providers as base64.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://minio:9000}
      S3_BUCKET: ${S3_BUCKET:-pear-attachments}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_REGION: ${S3_REGION:-us-east-1}
    restart: unless-stopped
    networks:
      - pear

  # ── Pear MCP Server (optional) ─────────────────────────────────────────────
  # Streamable-HTTP MCP endpoint so external AI models (Claude Code, Cursor, …)
  # can use Pear as a memory store / notes backend. Clients authenticate with
  # an AI user's worker token as a Bearer token (mint one: `pnpm mcp:provision`).
  # Opt-in: docker compose --profile mcp up
  mcp:
    image: ${WORKER_IMAGE:-pear-worker:latest}
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: pear-mcp
    command: ["pnpm", "--filter", "@pear/worker", "mcp:http"]
    profiles: ["mcp"]
    depends_on:
      - spacetimedb
    ports:
      - "${PEAR_MCP_HTTP_PORT:-3888}:3888"
    environment:
      SPACETIMEDB_URI: ws://spacetimedb:3000
      SPACETIMEDB_DB_NAME: ${SPACETIMEDB_DB_NAME:-pear-dev}
      PEAR_MCP_HTTP_HOST: 0.0.0.0
      PEAR_MCP_HTTP_PORT: 3888
      # Host-header allowlist for DNS-rebinding protection. Add your public
      # hostname:port when exposing this beyond localhost.
      PEAR_MCP_ALLOWED_HOSTS: ${PEAR_MCP_ALLOWED_HOSTS:-localhost:3888,127.0.0.1:3888}
    restart: unless-stopped
    networks:
      - pear

networks:
  pear:
    driver: bridge

volumes:
  spacetimedb-data:
  spacetimedb-config:
  minio-data:
