log:
  level: info
  job_level: info
runner:
  file: /var/lib/pear-ci/.runner
  capacity: 1
  timeout: 1h
  shutdown_timeout: 40m
  insecure: false
  envs: {}
  env_file: ''
  labels:
    - 'pear-ci:docker://pear-ci-job:node22'
cache:
  enabled: true
  dir: /var/lib/pear-ci/cache
  host: '127.0.0.1'
  port: 0
  proxy_port: 0
container:
  # Fixtures publish their disposable database on the host's loopback interface.
  network: host
  privileged: false
  valid_volumes: []
  docker_host: automount
  force_pull: false
